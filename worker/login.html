<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unlock Newport Shores map</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f4f3ed;color:#21263a;font:16px system-ui}main{width:min(420px,100%);padding:28px}h1{font-size:27px}p{line-height:1.5}label{display:block;margin:24px 0 8px}input,button{font:inherit;padding:13px;width:100%;border-radius:8px;border:1px solid #9ca4ae}button{margin-top:16px;background:#21263a;color:white;cursor:pointer}#error{color:#a02121;min-height:24px}button:disabled{opacity:.6}</style><main><h1>Newport Shores</h1><p>Enter the shared password to open the live trick-or-treat map.</p><form><label for="password">Map password</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><button>Unlock map</button><p id="error" role="alert"></p></form></main><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const button=document.querySelector('button');button.disabled=true;document.getElementById('error').textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not unlock map');location.reload()}catch(e){document.getElementById('error').textContent=e.message;button.disabled=false}};</script></html>
